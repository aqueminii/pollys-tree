backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # 1. NARRATIVE ESSAYS & DISPATCHES
  - name: "chapters"
    label: "Narrative Chapters"
    folder: "content/chapters"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Chapter Number", name: "chapter_number", widget: "number", value_type: "int" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Era / Time Period", name: "era", widget: "string" }
      - label: "People Mentioned"
        name: "people_mentioned"
        widget: "relation"
        collection: "dossiers"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]
        multiple: true
        required: false
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Audio Narration File", name: "audio_file", widget: "file", required: false }
      - { label: "Narrative Body", name: "body", widget: "markdown" }

  # 2. MASTER EVIDENCE VAULT
  - name: "evidence"
    label: "Evidence Vault"
    folder: "content/evidence"
    create: true
    identifier_field: "evidence_id"
    slug: "{{evidence_id}}"
    fields:
      - { label: "Evidence ID", name: "evidence_id", widget: "string", hint: "e.g. EV-001, EV-002" }
      - { label: "Date (ISO)", name: "date_iso", widget: "date" }
      - { label: "Date Display", name: "date_display", widget: "string", hint: "e.g. October 15, 1898 or Circa 1880" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Source", name: "provenance", widget: "string", hint: "Where this document was found (e.g. Aunt Marilyn's Suitcase, Courthouse, Family Bible)" }
      - { label: "Thread ID", name: "thread_id", widget: "string", required: false }
      - label: "People Tagged"
        name: "people_tagged"
        widget: "relation"
        collection: "dossiers"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]
        multiple: true
        required: false
      - { label: "Document Images", name: "images", widget: "list", field: { label: "Image", name: "image", widget: "image" } }
      - { label: "OCR / Verified Transcript", name: "body", widget: "markdown" }

  # 3. CHARACTER DOSSIERS
  - name: "dossiers"
    label: "Character Dossiers"
    folder: "content/dossiers"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Full Name", name: "name", widget: "string" }
      - { label: "Birth Year / Era", name: "birth_year", widget: "string", required: false }
      - { label: "Death Year", name: "death_year", widget: "string", required: false }
      - { label: "Generation", name: "generation", widget: "string", hint: "e.g. Generation 1 (Polly Smith), Generation 2 (Lizzie Newton)" }
      - { label: "Portrait / Photograph", name: "portrait", widget: "image", required: false }
      - { label: "Bio & Life Summary", name: "body", widget: "markdown" }

  # 4. INVESTIGATION THREADS
  - name: "threads"
    label: "Where the Trail Leads Next"
    folder: "content/threads"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Thread Title", name: "title", widget: "string" }
      - { label: "Target Entity / Question", name: "target", widget: "string" }
      - { label: "Target Jurisdiction", name: "jurisdiction", widget: "string" }
      - { label: "Investigation Status", name: "status", widget: "select", options: ["Active Lead", "Records Requested", "Confirmed Fact", "Brick Wall"] }
      - { label: "Next Action Item", name: "next_action", widget: "string" }
      - { label: "Thread Notes & Research Log", name: "body", widget: "markdown" }

  # 5. DISPATCHES & ARCHIVE NEWS
  - name: "updates"
    label: "Archive Updates & News"
    folder: "content/updates"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Summary", name: "summary", widget: "string" }
      - { label: "Update Body", name: "body", widget: "markdown" }

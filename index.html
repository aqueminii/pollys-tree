<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polly's Tree — Archive</title>
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body {
      background-color: #F9F6F0;
      color: #1A2228;
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #8C4827; }
    p { font-size: 1.2rem; max-width: 600px; line-height: 1.6; }
    a.admin-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #8C4827;
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 4px;
      font-family: sans-serif;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Polly’s Tree</h1>
  <p>The Matriarchal Line of Polly Smith, Lizzie Newton, Hattie McDaniel, and Ida Belle Price.</p>
  <a href="/admin/" class="admin-btn">Open Archive Admin</a>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
